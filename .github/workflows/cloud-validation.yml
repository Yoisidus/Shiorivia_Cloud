name: Cloud validation (dev/main)

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install isolated test-only IndexedDB simulator
        run: npm install --no-save --no-package-lock fake-indexeddb@6
      - name: Validate TypeScript types
        run: npx tsc --noEmit
      - name: Verify first-run browser session is a saved checkpoint
        run: npm run test:cloud-bootstrap
      - name: Exercise Cloud IDE persistence and ZIP compatibility
        run: npm run test:cloud-ide
      - name: Verify public Cloud API request guards and size limits
        run: npm run test:cloud-api
      - name: Verify encrypted browser BYOK vault
        run: npm run test:cloud-vault
      - name: Verify single-tab Cloud access
        run: npm run test:cloud-single-tab
      - name: Validate production build
        run: npm run build
